<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X2EPJ9100K"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-X2EPJ9100K');
    </script>
</head>

<body>
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
                <span id="homeHeader" class="fs-4">Public Website Networks by Ngoc Nguyen</span>
            </a>

            <ul class="nav nav-underline">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="network.html" class="nav-link">Networks</a></li>
                <li class="nav-item"><a href="login.html" class="nav-link active">Owner Login</a></li>
            </ul>
        </header>

        <main class="row justify-content-center">
            <section class="col-12 col-md-7 col-lg-5">
                <div class="card shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h1 class="h3 text-center mb-3">Owner Login</h1>

                        <p class="text-muted small text-center">
                            This form demonstrates secure session concepts, cookies, and CSRF protection.
                        </p>

                        <div id="message" class="alert d-none" role="alert"></div>

                        <form id="loginForm">
                            <input type="hidden" id="csrfToken" name="csrfToken">

                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>

                        <hr>

                        <p class="small text-muted mb-0">
                            Demo username: <strong>owner</strong><br>
                            Demo password: <strong>project123</strong>
                        </p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script/"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
